<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared.css">
    <style>
        .loichao{
            font-family: var(--font-script);
            color: var(--rose);
            font-size: clamp(52px, 11vw, 100px);
            margin: 0;
            text-shadow: 0 4px 18px rgba(214, 41, 62, 0.25);
        }
        .dudo{
            font-weight: 500;
            color: var(--text);
            font-size: clamp(18px, 3.4vw, 26px);
            line-height: 1.6;
            max-width: 640px;
            margin: 14px 0 0;
        }
        .sticker{
            width: min(300px, 50vw);
            height: auto;
            margin-top: 18px;
            filter: drop-shadow(0 8px 10px rgba(155, 28, 49, 0.25));
            animation: stickerPop 0.7s cubic-bezier(.2,1.6,.4,1) 1s both;
        }
        @keyframes stickerPop{
            from{ opacity: 0; transform: scale(0) rotate(-20deg); }
            to{ opacity: 1; transform: scale(1) rotate(0); }
        }
        #khongnhan{ position: relative; transition: transform 0.25s cubic-bezier(.3,1.6,.5,1); }
        .tim{ display: inline-block; animation: beat 1.2s infinite; }
        @keyframes beat{ 0%,100%{ transform: scale(1);} 50%{ transform: scale(1.25);} }
    </style>
</head>
<body>
    <h1 class="loichao reveal" style="--i:0">Hé lu cô ạ :33</h1>
    <h2 class="dudo reveal" style="--i:2">Nhân một ngày đặc biệt, chúng em muốn tặng cô một món quà, cô có muốn nhận không ạ? <span class="tim">💗</span></h2>
    <img class="sticker" src="Cat Bugcat GIF by Capoo.gif" alt="Sticker" onerror="this.style.display='none'">
    <div class="btn-row reveal" style="--i:4">
        <a href="dongy.html"><button class="btn">Có chứ!</button></a>
        <button class="btn ghost" id="khongnhan">Phiền lắm</button>
    </div>
    <script src="shared.js"></script>
    <script>
        // Nút "Phiền lắm" cứ bị chạm vào là né sang chỗ khác :D
        // (viết lại: nút được tách ra khỏi hàng nút và đặt theo toạ độ màn hình,
        //  nên không còn bị giật khi di chuột vào nhiều lần)
        var nut = document.getElementById('khongnhan');
        var cau = ['Phiền lắm', 'Không nhận thật ạ 😞', 'Nhận đi mà cô 🥺', 'Hông nhận là bọn em buồn lắm á!!', 'Thôi nhận đi cô ơi 🥺'];
        var lanNe = 0, daTach = false, khoa = false;
        var px = 0, py = 0;            // góc trên-trái hiện tại của nút (toạ độ màn hình)
        var LE = 14;                   // chừa mép màn hình
        var MS = 350;                  // thời gian nút trượt sang chỗ mới (ms)

        // Lần né đầu tiên: nhấc nút ra khỏi hàng, để lại một chỗ trống đúng cỡ nên hàng nút không bị xô lệch
        function tach(){
            var r = nut.getBoundingClientRect();
            var cho = document.createElement('span');
            cho.style.width = r.width + 'px';
            cho.style.height = r.height + 'px';
            nut.parentNode.insertBefore(cho, nut);
            document.body.appendChild(nut);
            nut.style.position = 'fixed';
            nut.style.left = '0';
            nut.style.top = '0';
            nut.style.margin = '0';
            nut.style.zIndex = '50';
            nut.style.minWidth = r.width + 'px';
            nut.style.maxWidth = (window.innerWidth - 2 * LE) + 'px';
            nut.style.transition = 'none';
            px = r.left; py = r.top;
            nut.style.transform = 'translate(' + px + 'px,' + py + 'px)';
            nut.offsetWidth;           // ép trình duyệt vẽ vị trí xuất phát trước khi trượt
            nut.style.transition = 'transform ' + MS + 'ms cubic-bezier(.22,1,.36,1)';
            daTach = true;
        }

        function ne(e){
            e.preventDefault();
            if (khoa) return;          // đang trượt thì bỏ qua, tránh bị kích hoạt dồn dập gây giật
            khoa = true;
            setTimeout(function(){ khoa = false; }, MS + 80);

            if (!daTach) tach();
            lanNe++;
            nut.textContent = cau[Math.min(lanNe, cau.length - 1)];

            // vị trí con trỏ / ngón tay (để chọn chỗ mới tránh xa nó)
            var t = (e.touches && e.touches[0]) || e;
            var mx = (t.clientX !== undefined) ? t.clientX : -999;
            var my = (t.clientY !== undefined) ? t.clientY : -999;

            var w = nut.offsetWidth, h = nut.offsetHeight;
            var maxX = Math.max(LE, window.innerWidth  - LE - w);
            var maxY = Math.max(LE, window.innerHeight - LE - h);

            var nx = px, ny = py, tot = false;
            for (var i = 0; i < 40 && !tot; i++){
                nx = LE + Math.random() * (maxX - LE);
                ny = LE + Math.random() * (maxY - LE);
                var xaCu  = Math.hypot(nx - px, ny - py) > 140;                 // đủ xa chỗ cũ để thấy rõ là né
                var xaTro = (mx < nx - 70 || mx > nx + w + 70 || my < ny - 70 || my > ny + h + 70);  // không nằm sát con trỏ
                tot = xaCu && xaTro;
            }
            px = nx; py = ny;
            nut.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px) rotate(' + (Math.random() * 14 - 7).toFixed(1) + 'deg)';
        }
        nut.addEventListener('mouseenter', ne);
        nut.addEventListener('touchstart', ne, {passive: false});
        nut.addEventListener('click', ne);

        // Xoay màn hình / đổi cỡ cửa sổ thì kéo nút về trong màn hình
        window.addEventListener('resize', function(){
            if (!daTach) return;
            nut.style.maxWidth = (window.innerWidth - 2 * LE) + 'px';
            px = Math.min(Math.max(LE, px), Math.max(LE, window.innerWidth  - LE - nut.offsetWidth));
            py = Math.min(Math.max(LE, py), Math.max(LE, window.innerHeight - LE - nut.offsetHeight));
            nut.style.transform = 'translate(' + px + 'px,' + py + 'px)';
        });
    </script>
</body>
</html>
